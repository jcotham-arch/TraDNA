services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradna
      POSTGRES_USER: tradna
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tradna_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradna -d tradna"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tradna_postgres:

